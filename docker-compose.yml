services:
  # ==================== MySQL ====================
  mysql:
    image: mysql:8.0
    container_name: opsdeck-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-root}
      MYSQL_DATABASE: life_archive
      TZ: Asia/Shanghai
    ports:
      - "3308:3306"
    volumes:
      - ${LIFEARCHIVE_DIR:-../life}/sql/init.sql:/docker-entrypoint-initdb.d/01-init.sql
      - mysql-data:/var/lib/mysql
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --default-authentication-plugin=mysql_native_password
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${DB_PASSWORD:-root}"]
      interval: 10s
      timeout: 5s
      retries: 15

  # ==================== Redis ====================
  redis:
    image: redis:7-alpine
    container_name: opsdeck-redis
    restart: unless-stopped
    ports:
      - "6380:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # ==================== Spring Boot Backend（复用 LifeArchive 的多阶段 Dockerfile）====================
  backend:
    build:
      context: ${LIFEARCHIVE_DIR:-../life}/backend
      args:
        MAVEN_MIRROR: ${MAVEN_MIRROR:-aliyun}
    container_name: opsdeck-backend
    restart: unless-stopped
    ports:
      - "8081:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/life_archive?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD:-root}
      SPRING_DATA_REDIS_HOST: redis
      SPRING_AI_EMBEDDING_TRANSFORMER_ONNX_MODEL_URI: https://modelscope.cn/models/AI-ModelScope/all-MiniLM-L6-v2/resolve/master/onnx/model.onnx
      SPRING_AI_EMBEDDING_TRANSFORMER_TOKENIZER_URI: https://modelscope.cn/models/AI-ModelScope/all-MiniLM-L6-v2/resolve/master/tokenizer.json
      SPRING_AI_EMBEDDING_TRANSFORMER_CACHE_DIRECTORY: /root/.cache/spring-ai
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      LIFEARCHIVE_JWT_SECRET: ${LIFEARCHIVE_JWT_SECRET:-}
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - upload-data:/app/upload
      - spring-ai-cache:/root/.cache/spring-ai

  # ==================== Nginx（反向代理 + 前端静态托管）====================
  nginx:
    image: nginx:1.27-alpine
    container_name: opsdeck-nginx
    restart: unless-stopped
    ports:
      - "8088:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ${LIFEARCHIVE_DIR:-../life}/frontend/dist:/usr/share/nginx/html:ro
    depends_on:
      - backend

  # ==================== Prometheus（指标采集）====================
  prometheus:
    image: prom/prometheus:v2.53.0
    container_name: opsdeck-prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./prometheus/alert.rules.yml:/etc/prometheus/alert.rules.yml:ro
      - prometheus-data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=15d'
    depends_on:
      - alertmanager

  # ==================== Alertmanager（告警管理）====================
  alertmanager:
    image: prom/alertmanager:v0.27.0
    container_name: opsdeck-alertmanager
    restart: unless-stopped
    ports:
      - "9093:9093"
    volumes:
      - ./alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - alertmanager-data:/alertmanager
    command:
      - '--config.file=/etc/alertmanager/alertmanager.yml'
      - '--storage.path=/alertmanager'

  # ==================== Grafana（可视化）====================
  grafana:
    image: grafana/grafana:10.4.8
    container_name: opsdeck-grafana
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD:-admin}
      - GF_USERS_ALLOW_SIGN_UP=false
      # 本地演示：开启匿名只读访问，方便直接查看面板；生产 compose 未开启
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Viewer
    volumes:
      - grafana-data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - prometheus

  # ==================== Node Exporter（宿主机指标）====================
  node-exporter:
    image: prom/node-exporter:v1.8.2
    container_name: opsdeck-node-exporter
    restart: unless-stopped
    ports:
      - "9100:9100"
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/host/rootfs:ro
    command:
      - '--path.procfs=/host/proc'
      - '--path.sysfs=/host/sys'
      - '--path.rootfs=/host/rootfs'

  # ==================== Loki（日志聚合存储）====================
  loki:
    image: grafana/loki:2.9.6
    container_name: opsdeck-loki
    restart: unless-stopped
    ports:
      - "3100:3100"
    command: -config.file=/etc/loki/local-config.yaml
    volumes:
      - ./loki/loki-config.yaml:/etc/loki/local-config.yaml:ro
      - loki-data:/loki

  # ==================== Promtail（日志采集 agent）====================
  promtail:
    image: grafana/promtail:2.9.6
    container_name: opsdeck-promtail
    restart: unless-stopped
    volumes:
      - ./loki/promtail-config.yaml:/etc/promtail/config.yml:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
    command: -config.file=/etc/promtail/config.yml
    depends_on:
      - loki

volumes:
  mysql-data:
  redis-data:
  upload-data:
  spring-ai-cache:
  prometheus-data:
  alertmanager-data:
  grafana-data:
  loki-data:
