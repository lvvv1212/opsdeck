# OpsDeck — Prometheus 主配置
# 采集目标：LifeArchive 后端(Actuator Micrometer) + 宿主机(node_exporter) + Prometheus 自身

global:
  scrape_interval: 15s      # 默认抓取间隔
  evaluation_interval: 15s  # 告警规则评估间隔
  external_labels:
    monitor: opsdeck

# 告警规则文件（挂载到容器内 /etc/prometheus/alert.rules.yml）
rule_files:
  - /etc/prometheus/alert.rules.yml

# 告警发送到 Alertmanager
alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - alertmanager:9093

scrape_configs:
  # ==================== LifeArchive 后端（Spring Boot Actuator）====================
  - job_name: life-archive
    metrics_path: /actuator/prometheus
    scrape_interval: 10s
    static_configs:
      - targets:
          - backend:8080

  # ==================== 宿主机指标（node_exporter）====================
  - job_name: node
    scrape_interval: 15s
    static_configs:
      - targets:
          - node-exporter:9100

  # ==================== Prometheus 自身 ====================
  - job_name: prometheus
    static_configs:
      - targets:
          - localhost:9090
