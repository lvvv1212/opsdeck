# OpsDeck 生产 Nginx 配置（HTTP → HTTPS 重定向 + SSL 反代）
# 使用前：把 your-domain.com 替换为你的真实域名（需已解析到服务器 IP）

# HTTP：仅用于 certbot 验证 + 跳转 HTTPS
server {
    listen 80;
    server_name your-domain.com;

    # certbot 证书验证目录
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS：前端托管 + API 反代
server {
    listen 443 ssl;
    server_name your-domain.com;

    # certbot 签发的证书（首次由 deploy/README.md 的 certbot 命令生成）
    ssl_certificate     /etc/letsencrypt/live/your-domain.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/your-domain.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    # 前端静态资源（已打进 opsdeck-nginx 镜像）
    root /usr/share/nginx/html;
    index index.html;

    # API 反向代理到后端
    location /api/ {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 上传文件静态资源反向代理到后端
    location /upload/ {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # SPA 前端路由 fallback（history 模式）
    location / {
        try_files $uri $uri/ /index.html;
    }
}
